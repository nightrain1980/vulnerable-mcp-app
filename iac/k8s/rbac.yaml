# VULN: RBAC configuration with excessive permissions

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vulnmcp-default
  namespace: vulnmcp

---
# VULN: RBAC-001 — Binding default SA to cluster-admin
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vulnmcp-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin  # VULN: Full cluster access
subjects:
- kind: ServiceAccount
  name: vulnmcp-default
  namespace: vulnmcp

---
# VULN: RBAC-002 — Wildcard role with all verbs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vulnmcp-wildcard-role
rules:
- apiGroups: ["*"]      # All API groups
  resources: ["*"]      # All resources
  verbs: ["*"]          # All verbs (get, list, create, delete, etc.)

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vulnmcp-wildcard-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vulnmcp-wildcard-role
subjects:
- kind: ServiceAccount
  name: vulnmcp-default
  namespace: vulnmcp
